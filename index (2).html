<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배송 관제 · 미확인 기사 위치 콜 (브라우저 통화)</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e7e9ee; --muted:#9aa1ad; --hint:#6b7280;
    --info:#378add; --info-bg:#13233a; --success:#1d9e75; --success-bg:#0f2a22;
    --danger:#e24b4a; --danger-bg:#2a1414; --warn:#ef9f27; --warn-bg:#2a1f0d;
    --radius:12px; --radius-sm:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--txt); line-height:1.6;}
  .wrap{max-width:1100px; margin:0 auto; padding:20px;}
  header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .logo{width:42px; height:42px; border-radius:var(--radius-sm); background:var(--info-bg); color:var(--info);
    display:flex; align-items:center; justify-content:center; font-size:22px;}
  .brand h1{margin:0; font-size:18px; font-weight:600;}
  .brand p{margin:0; font-size:13px; color:var(--muted);}
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 14px; min-width:88px;}
  .stat .lbl{font-size:11px; color:var(--muted); display:block;}
  .stat .val{font-size:20px; font-weight:600;}
  .v-success{color:var(--success);} .v-info{color:var(--info);} .v-warn{color:var(--warn);}

  .setup{background:var(--warn-bg); border:1px solid var(--warn); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:18px; font-size:13px; color:var(--warn);}
  .setup code{background:#0008; padding:2px 6px; border-radius:4px; color:var(--txt);}

  .section-head{display:flex; align-items:center; gap:8px; margin:0 0 12px; font-size:14px; font-weight:600;}
  .section-head .sub{font-size:12px; color:var(--muted); font-weight:400;}
  .section{margin-bottom:26px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px;}

  button{font-family:inherit; cursor:pointer; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:var(--panel2); color:var(--txt); padding:9px 16px; font-size:13px; transition:.15s;}
  button:hover{border-color:var(--info);}
  button.call-btn{border-color:var(--info); color:var(--info);}
  button.end-btn{border-color:var(--danger); color:var(--danger);}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
  .card.tracked{border-left:3px solid var(--success);}
  .card.untracked{border-left:3px solid var(--warn);}
  .card .top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .who{font-size:15px; font-weight:600;}
  .orders-mini{font-size:11px; color:var(--hint); margin-top:3px;}
  .track-line{margin-top:10px; padding:8px 10px; border-radius:var(--radius-sm); background:var(--panel2); font-size:13px;}
  .eta-ok{color:var(--success);} .eta-no{color:var(--warn);}

  .call-zone{margin-top:10px; padding:10px 12px; border-radius:var(--radius-sm); background:var(--panel2); display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:44px;}
  .call-state{display:flex; align-items:center; gap:8px; font-size:13px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
  .d-idle{background:var(--hint);} .d-calling{background:var(--warn);} .d-done{background:var(--success);}
  .s-idle{color:var(--muted);} .s-calling{color:var(--warn);} .s-done{color:var(--success);}
  .blink{animation:bk 1s infinite;} @keyframes bk{50%{opacity:.35;}}

  .live{margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto;}
  .msg{font-size:12px; padding:6px 10px; border-radius:8px; max-width:90%;}
  .msg .lbl{font-size:10px; opacity:.65; display:block; margin-bottom:1px;}
  .msg.ai{background:var(--info-bg); align-self:flex-start;}
  .msg.drv{background:var(--panel2); align-self:flex-end;}
  .placeholder{font-size:12px; color:var(--hint); margin-top:8px;}
  .summary-box{font-size:13px; background:var(--success-bg); padding:8px 10px; border-radius:6px; margin-top:8px; color:var(--txt);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo">📡</div>
      <div>
        <h1>배송 관제판 · 미확인 기사 위치 콜</h1>
        <p>버튼을 누르면 브라우저에서 AI와 한국어 통화 → 내용이 카드에 기록</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">위치 확인됨</span><span class="val v-success" id="s-tracked">0</span></div>
      <div class="stat"><span class="lbl">확인 필요</span><span class="val v-warn" id="s-untracked">0</span></div>
      <div class="stat"><span class="lbl">통화 완료</span><span class="val v-success" id="s-done">0</span></div>
    </div>
  </header>

  <div class="setup" id="setup-warn">
    ⚙️ 설정 필요: 이 파일을 열어 아래 두 곳을 채우세요 →
    <code>VAPI_PUBLIC_KEY</code> (Vapi의 Public Key), <code>ASSISTANT_ID</code> (관제 ai 에이전트 ID).
    채우면 이 안내는 사라집니다.
  </div>

  <div class="section">
    <div class="section-head"><span class="eta-ok">●</span> 트럭커 앱 연동됨 — 위치 확인 가능 <span class="sub" id="cnt-tracked"></span></div>
    <div class="grid" id="grid-tracked"></div>
  </div>

  <div class="section">
    <div class="section-head"><span class="eta-no">●</span> 위치 미확인 — 전화 확인 대상 <span class="sub" id="cnt-untracked"></span></div>
    <div class="grid" id="grid-untracked"></div>
  </div>
</div>

<script type="module">
import Vapi from "https://esm.sh/@vapi-ai/web@2.3.8";

// ============================================================
//  여기 두 곳만 채우세요 (Vapi 대시보드에서 복사)
// ============================================================
const VAPI_PUBLIC_KEY = "d483cdde-b8c6-4931-8f54-f24ce4d734af";   // 프로필 → Vapi API Keys → Public Key
const ASSISTANT_ID    = "27aeaa6f-21c4-4449-842e-3d312d727167"; // 관제 ai 에이전트 상단의 ID
// ============================================================

const DRIVERS = {
  D1:{name:"김성호", tracked:true,  eta:"14:35", loc:"분당 수내IC 부근"},
  D2:{name:"이재민", tracked:true,  eta:"15:02", loc:"용인 신갈JC 통과"},
  D3:{name:"박동우", tracked:true,  eta:"15:20", loc:"김포 고촌 진입"},
  D4:{name:"최영규", tracked:false},
  D5:{name:"정한솔", tracked:false},
};
const ORDERS = [
  {id:"ORD-20471", driver:"D1", dest:"분당센터"},
  {id:"ORD-20488", driver:"D2", dest:"용인B창고"},
  {id:"ORD-20495", driver:"D3", dest:"김포허브"},
  {id:"ORD-20502", driver:"D4", dest:"광주물류"},
  {id:"ORD-20510", driver:"D5", dest:"군포센터"},
];

const configured = !VAPI_PUBLIC_KEY.startsWith("여기에") && !ASSISTANT_ID.startsWith("여기에");
if(configured) document.getElementById('setup-warn').style.display='none';

let vapi = configured ? new Vapi(VAPI_PUBLIC_KEY) : null;
let state = {};        // driverId -> idle|calling|done
let liveMsgs = {};     // driverId -> [{who,text}]
let activeDriver = null;

function untracked(){ return Object.keys(DRIVERS).filter(d=>!DRIVERS[d].tracked); }
function tracked(){ return Object.keys(DRIVERS).filter(d=>DRIVERS[d].tracked); }
function ordersOf(d){ return ORDERS.filter(o=>o.driver===d); }

function init(){ untracked().forEach(d=>{ state[d]='idle'; liveMsgs[d]=[]; }); render(); }

function updateStats(){
  document.getElementById('s-tracked').textContent = tracked().length;
  document.getElementById('s-untracked').textContent = untracked().length;
  document.getElementById('s-done').textContent = Object.values(state).filter(s=>s==='done').length;
  document.getElementById('cnt-tracked').textContent = '('+tracked().length+'명)';
  document.getElementById('cnt-untracked').textContent = '('+untracked().length+'명)';
}

function render(){
  const gt = document.getElementById('grid-tracked'); gt.innerHTML='';
  tracked().forEach(d=>{
    const drv = DRIVERS[d];
    const card = document.createElement('div'); card.className='card tracked';
    card.innerHTML = '<div class="top"><div><span class="who">👤 '+drv.name+' 기사</span>'
      + '<div class="orders-mini">'+ordersOf(d).map(o=>o.id+'('+o.dest+')').join(', ')+'</div></div></div>'
      + '<div class="track-line eta-ok">📍 <b>'+drv.loc+'</b> · 앱 ETA '+drv.eta+' · 전화 불필요</div>';
    gt.appendChild(card);
  });

  const gu = document.getElementById('grid-untracked'); gu.innerHTML='';
  untracked().forEach(d=>{
    const drv = DRIVERS[d]; const st = state[d];
    const card = document.createElement('div'); card.className='card untracked';
    let h = '<div class="top"><div><span class="who">👤 '+drv.name+' 기사</span>'
      + '<div class="orders-mini">'+ordersOf(d).map(o=>o.id+'('+o.dest+')').join(', ')+'</div></div></div>'
      + '<div class="track-line eta-no">❓ <b>위치 미확인</b> · 앱 미연동 — 전화로 확인</div>';

    h += '<div class="call-zone">';
    if(st==='idle'){
      h += '<span class="call-state s-idle"><span class="dot d-idle"></span>발신 대기</span>'
        + '<button class="call-btn" data-call="'+d+'">📞 전화 걸기</button>';
    } else if(st==='calling'){
      h += '<span class="call-state s-calling blink"><span class="dot d-calling"></span>통화 중...</span>'
        + '<button class="end-btn" data-end="'+d+'">통화 종료</button>';
    } else if(st==='done'){
      h += '<span class="call-state s-done"><span class="dot d-done"></span>통화 완료</span>'
        + '<button data-call="'+d+'">↻ 다시 통화</button>';
    }
    h += '</div>';

    const msgs = liveMsgs[d] || [];
    if(msgs.length){
      h += '<div class="live">';
      msgs.forEach(m=>{ h += '<div class="msg '+(m.who==='ai'?'ai':'drv')+'"><span class="lbl">'+(m.who==='ai'?'AI 에이전트(로지)':drv.name+' 기사')+'</span>'+m.text+'</div>'; });
      h += '</div>';
    } else if(st==='idle'){
      h += '<div class="placeholder">전화 걸기를 누르면 브라우저에서 AI와 통화가 시작됩니다.</div>';
    }
    if(st==='done' && msgs.length){
      h += '<div class="summary-box">✓ 통화 기록 저장됨 — 위 대화가 이 기사 카드에 보관됩니다.</div>';
    }
    card.innerHTML = h; gu.appendChild(card);
  });

  gu.querySelectorAll('[data-call]').forEach(b=> b.onclick = ()=> startCall(b.dataset.call));
  gu.querySelectorAll('[data-end]').forEach(b=> b.onclick = ()=> endCall());
  updateStats();
}

async function startCall(d){
  if(!configured){ alert("먼저 파일을 열어 VAPI_PUBLIC_KEY와 ASSISTANT_ID를 채워주세요."); return; }
  if(activeDriver){ alert("이미 다른 통화가 진행 중이에요. 먼저 종료해주세요."); return; }
  activeDriver = d;
  state[d]='calling'; liveMsgs[d]=[]; render();
  try{
    await vapi.start(ASSISTANT_ID, { variableValues: { driverName: DRIVERS[d].name } });
  }catch(e){
    console.error(e); alert("통화 시작 실패: "+e); state[d]='idle'; activeDriver=null; render();
  }
}
function endCall(){ if(vapi) vapi.stop(); }

if(vapi){
  vapi.on('message', (m)=>{
    console.log('[VAPI message]', m);
    if(m.type==='transcript' && m.transcriptType==='final' && activeDriver){
      const role = (m.role || m.speaker || '').toLowerCase();
      const who = (role.includes('assistant') || role.includes('bot') || role.includes('ai')) ? 'ai' : 'drv';
      const text = m.transcript || m.text || '';
      if(text){ liveMsgs[activeDriver].push({ who, text }); render(); }
    }
  });
  vapi.on('call-end', ()=>{
    if(activeDriver){ state[activeDriver]='done'; activeDriver=null; render(); }
  });
  vapi.on('error', (e)=>{ console.error('Vapi error', e); });
}

init();
</script>
</body>
</html>
